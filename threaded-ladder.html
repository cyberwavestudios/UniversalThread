<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Golden Thread: Cosmic Scale Ladder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
        }

        body {
            background: #0a0f1a;
            color: #ffd700;
            font-family: 'Georgia', serif;
            touch-action: manipulation;
        }

        .cosmos {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: radial-gradient(ellipse at center, #1a2040 0%, #0a0f1a 70%);
            overflow: hidden;
        }

        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(1px 1px at 20px 30px, #ffd700, transparent),
                radial-gradient(1px 1px at 40px 70px, #ffd700, transparent),
                radial-gradient(0.5px 0.5px at 90px 40px, #fff, transparent),
                radial-gradient(0.5px 0.5px at 130px 80px, #fff, transparent);
            background-repeat: repeat;
            background-size: 150px 80px;
            opacity: 0.4;
            animation: twinkle 8s ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.2; }
            100% { opacity: 0.6; }
        }

        .viewport {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 90vmin;
            height: 90vmin;
            transform: translate(-50%, -50%);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 50%;
            overflow: visible;
        }

        .center {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
        }

        .golden-thread {
            position: absolute;
            background: linear-gradient(90deg, transparent, #ffd700, #ffd700, transparent);
            height: 2px;
            opacity: 0;
            transform-origin: left center;
            animation: pulse-thread 3s ease-in-out infinite;
            left: 0;
            top: -1px;
        }

        @keyframes pulse-thread {
            0%, 100% { opacity: 0.3; box-shadow: 0 0 5px #ffd700; }
            50% { opacity: 0.8; box-shadow: 0 0 15px #ffd700; }
        }

        .celestial-body {
            position: absolute;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: all 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 5;
        }

        .self {
            width: 12px;
            height: 12px;
            background: radial-gradient(circle, #ffd700 0%, #ff6b35 100%);
            box-shadow: 0 0 15px #ffd700;
        }

        .earth {
            width: 20px;
            height: 20px;
            background: radial-gradient(circle, #4a90e2 0%, #2e5c8a 100%);
            box-shadow: 0 0 20px #4a90e2;
        }

        .moon {
            width: 14px;
            height: 14px;
            background: radial-gradient(circle, #d3d3d3 0%, #a0a0a0 100%);
            box-shadow: 0 0 15px #d3d3d3;
        }

        .sun {
            width: 30px;
            height: 30px;
            background: radial-gradient(circle, #fff 0%, #ffd700 50%, #ff6b35 100%);
            box-shadow: 0 0 40px #ffd700;
        }

        .galaxy-center {
            width: 24px;
            height: 24px;
            background: radial-gradient(circle, #ff1493 0%, #4b0082 100%);
            box-shadow: 0 0 30px #ff1493;
        }

        .horizon {
            width: 35px;
            height: 35px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.6) 0%, rgba(255, 215, 0, 0.1) 100%);
            border: 2px solid #ffd700;
            box-shadow: 0 0 50px #ffd700;
        }

        .orbit-path {
            position: absolute;
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: all 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
        }

        .scale-info {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #ffd700;
            width: 90%;
            max-width: 350px;
            backdrop-filter: blur(10px);
            z-index: 1000;
        }

        .controls {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            z-index: 100;
            width: 90%;
            max-width: 300px;
        }

        .scale-btn {
            background: rgba(255, 215, 0, 0.2);
            border: 1px solid #ffd700;
            color: #ffd700;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            text-align: center;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .scale-btn:hover, .scale-btn.active {
            background: rgba(255, 215, 0, 0.4);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }

        .scale-number {
            font-size: 18px;
            font-weight: bold;
            color: #ff6b35;
            margin-bottom: 8px;
        }

        .progress-indicator {
            position: absolute;
            top: 100px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .progress-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            border: 1px solid #ffd700;
            background: transparent;
            transition: all 0.3s ease;
        }

        .progress-dot.active {
            background: #ffd700;
            box-shadow: 0 0 10px #ffd700;
        }

        .tap-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            opacity: 0.6;
            text-align: center;
            pointer-events: none;
            animation: fade-in-out 4s ease-in-out infinite;
        }

        @keyframes fade-in-out {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }

        /* Mobile specific adjustments */
        @media (max-width: 480px) {
            .scale-info {
                font-size: 12px;
                padding: 10px;
                bottom: 10px;
            }
            
            .controls {
                top: 10px;
                gap: 6px;
            }
            
            .scale-btn {
                font-size: 11px;
                padding: 6px 8px;
            }
            
            .scale-number {
                font-size: 16px;
            }
            
            .progress-indicator {
                top: 80px;
                right: 10px;
            }
        }

        /* Landscape mobile */
        @media (max-height: 500px) and (orientation: landscape) {
            .scale-info {
                bottom: 5px;
                font-size: 11px;
                padding: 8px;
            }
            
            .controls {
                top: 5px;
                gap: 4px;
            }
            
            .scale-btn {
                font-size: 10px;
                padding: 4px 6px;
            }
        }

        .cosmic-spiral {
            position: absolute;
            width: 60vmin;
            height: 60vmin;
            border: 1px solid rgba(255, 215, 0, 0.1);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: rotate 15s linear infinite;
            opacity: 0;
            transition: opacity 1s ease;
            left: 0;
            top: 0;
        }

        @keyframes rotate {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="cosmos">
        <div class="stars"></div>

        <div class="controls">
            <button class="scale-btn active" data-scale="self">Self</button>
            <button class="scale-btn" data-scale="moon">Moon</button>
            <button class="scale-btn" data-scale="sun">Sun</button>
            <button class="scale-btn" data-scale="galaxy">Galaxy</button>
            <button class="scale-btn" data-scale="horizon">Horizon</button>
            <button class="scale-btn" data-scale="return">Return</button>
        </div>

        <div class="progress-indicator">
            <div class="progress-dot active" data-step="0"></div>
            <div class="progress-dot" data-step="1"></div>
            <div class="progress-dot" data-step="2"></div>
            <div class="progress-dot" data-step="3"></div>
            <div class="progress-dot" data-step="4"></div>
            <div class="progress-dot" data-step="5"></div>
        </div>

        <div class="viewport">
            <div class="center">
                <div class="celestial-body self" id="self"></div>
                <div class="celestial-body earth" id="earth"></div>
                <div class="celestial-body moon" id="moon"></div>
                <div class="celestial-body sun" id="sun"></div>
                <div class="celestial-body galaxy-center" id="galaxy"></div>
                <div class="celestial-body horizon" id="horizon"></div>
                
                <div class="orbit-path" id="orbit"></div>
                <div class="golden-thread" id="thread"></div>
                <div class="cosmic-spiral" id="spiral"></div>
            </div>
        </div>

        <div class="tap-hint" id="hint">Tap anywhere to explore the cosmos</div>

        <div class="scale-info" id="info">
            <div class="scale-number">×1</div>
            <div id="description">You are the center, the axis of all circles.<br/>From your heart, the golden thread begins.</div>
            <div id="ratio">Earth radius: 6,371 km</div>
        </div>
    </div>

    <script>
        // Convert pixel positions to viewport percentages for consistent scaling
        const scales = {
            self: {
                multiplier: '×1',
                description: 'You are the center, the axis of all circles.<br/>From your heart, the golden thread begins.',
                ratio: 'Earth radius: 6,371 km',
                positions: { 
                    self: {x: 0, y: 0}, 
                    earth: {x: 0, y: -8}, 
                    moon: {x: -50, y: -50}, 
                    sun: {x: -60, y: -60}, 
                    galaxy: {x: -70, y: -70}, 
                    horizon: {x: -80, y: -80} 
                },
                threadLength: 0,
                orbitSize: 0,
                activeBody: 'self'
            },
            moon: {
                multiplier: '×60',
                description: 'Earth\'s radius scaled by 60 reaches the Moon.<br/>You become the radius of lunar orbit.',
                ratio: 'Earth-Moon: 384,400 km',
                positions: { 
                    self: {x: 0, y: 0}, 
                    earth: {x: 0, y: -8}, 
                    moon: {x: 25, y: 0}, 
                    sun: {x: -60, y: -60}, 
                    galaxy: {x: -70, y: -70}, 
                    horizon: {x: -80, y: -80} 
                },
                threadLength: 25,
                orbitSize: 50,
                activeBody: 'moon'
            },
            sun: {
                multiplier: '×400',
                description: 'Moon\'s distance scaled by 400 reaches the Sun.<br/>The half-moon triangle reveals this truth.',
                ratio: 'Earth-Sun: 149.6 million km',
                positions: { 
                    self: {x: 0, y: 0}, 
                    earth: {x: 0, y: -8}, 
                    moon: {x: 15, y: 0}, 
                    sun: {x: 35, y: 0}, 
                    galaxy: {x: -70, y: -70}, 
                    horizon: {x: -80, y: -80} 
                },
                threadLength: 35,
                orbitSize: 70,
                activeBody: 'sun'
            },
            galaxy: {
                multiplier: '×26,000',
                description: 'Precession cycle unfolds: 26,000 years become<br/>26,000 light-years to Sagittarius A*.',
                ratio: 'Zodiac ladder to galactic center',
                positions: { 
                    self: {x: 0, y: 0}, 
                    earth: {x: 0, y: -5}, 
                    moon: {x: 8, y: 0}, 
                    sun: {x: 20, y: 0}, 
                    galaxy: {x: 40, y: -8}, 
                    horizon: {x: -80, y: -80} 
                },
                threadLength: 42,
                orbitSize: 84,
                activeBody: 'galaxy'
            },
            horizon: {
                multiplier: '×71',
                description: '71 galactic orbits span the event horizon.<br/>71 years = 1° precession. Perfect echo.',
                ratio: '~16 billion light-years to cosmic edge',
                positions: { 
                    self: {x: 0, y: 0}, 
                    earth: {x: 0, y: -3}, 
                    moon: {x: 5, y: 0}, 
                    sun: {x: 12, y: 0}, 
                    galaxy: {x: 25, y: -5}, 
                    horizon: {x: 42, y: -10} 
                },
                threadLength: 45,
                orbitSize: 90,
                activeBody: 'horizon'
            },
            return: {
                multiplier: '∞→1',
                description: 'All threads collapse inward through the same ratios.<br/>Return to breath, to heart, the source of all.',
                ratio: 'The eternal return',
                positions: { 
                    self: {x: 0, y: 0}, 
                    earth: {x: 0, y: -8}, 
                    moon: {x: -50, y: -50}, 
                    sun: {x: -60, y: -60}, 
                    galaxy: {x: -70, y: -70}, 
                    horizon: {x: -80, y: -80} 
                },
                threadLength: 0,
                orbitSize: 0,
                activeBody: 'self'
            }
        };

        let currentScale = 'self';
        let currentStep = 0;
        
        function updateScale(scaleName) {
            const scale = scales[scaleName];
            const info = document.getElementById('info');
            const thread = document.getElementById('thread');
            const orbit = document.getElementById('orbit');
            const spiral = document.getElementById('spiral');
            const hint = document.getElementById('hint');
            
            // Hide hint after first interaction
            hint.style.display = 'none';
            
            // Update active button
            document.querySelectorAll('.scale-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`[data-scale="${scaleName}"]`).classList.add('active');
            
            // Update progress indicators
            const scaleKeys = ['self', 'moon', 'sun', 'galaxy', 'horizon', 'return'];
            currentStep = scaleKeys.indexOf(scaleName);
            document.querySelectorAll('.progress-dot').forEach((dot, index) => {
                dot.classList.toggle('active', index === currentStep);
            });
            
            // Update info panel
            info.querySelector('.scale-number').textContent = scale.multiplier;
            info.querySelector('#description').innerHTML = scale.description;
            info.querySelector('#ratio').textContent = scale.ratio;
            
            // Get viewport dimensions for scaling
            const viewport = document.querySelector('.viewport');
            const vw = viewport.offsetWidth;
            const vh = viewport.offsetHeight;
            
            // Update positions using percentage of viewport
            Object.keys(scale.positions).forEach(bodyId => {
                const body = document.getElementById(bodyId);
                const pos = scale.positions[bodyId];
                
                // Convert percentage to actual pixels
                const x = (pos.x / 100) * vw;
                const y = (pos.y / 100) * vh;
                
                body.style.left = x + 'px';
                body.style.top = y + 'px';
                
                // Highlight active body
                if (bodyId === scale.activeBody) {
                    body.style.transform = 'translate(-50%, -50%) scale(1.3)';
                    body.style.zIndex = '10';
                } else {
                    body.style.transform = 'translate(-50%, -50%) scale(1)';
                    body.style.zIndex = '5';
                }
            });
            
            // Update golden thread
            if (scale.threadLength > 0) {
                const threadLength = (scale.threadLength / 100) * vw;
                thread.style.width = threadLength + 'px';
                thread.style.opacity = '1';
                
                const activePos = scale.positions[scale.activeBody];
                const x = (activePos.x / 100) * vw;
                const y = (activePos.y / 100) * vh;
                const angle = Math.atan2(y, x) * 180 / Math.PI;
                thread.style.transform = `rotate(${angle}deg)`;
            } else {
                thread.style.opacity = '0';
            }
            
            // Update orbit path
            if (scale.orbitSize > 0) {
                const orbitSize = (scale.orbitSize / 100) * Math.min(vw, vh);
                orbit.style.width = orbitSize + 'px';
                orbit.style.height = orbitSize + 'px';
                orbit.style.opacity = '0.4';
            } else {
                orbit.style.opacity = '0';
            }
            
            // Special effects for galaxy scale
            if (scaleName === 'galaxy' || scaleName === 'horizon') {
                spiral.style.opacity = '0.3';
            } else {
                spiral.style.opacity = '0';
            }
            
            currentScale = scaleName;
        }

        // Button controls
        document.querySelectorAll('.scale-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                updateScale(btn.dataset.scale);
            });
            
            // Handle touch events for mobile
            btn.addEventListener('touchend', (e) => {
                e.preventDefault();
                e.stopPropagation();
                updateScale(btn.dataset.scale);
            });
        });

        // Touch controls for main area
        let touchStartTime = 0;
        document.addEventListener('touchstart', (e) => {
            if (!e.target.classList.contains('scale-btn')) {
                touchStartTime = Date.now();
            }
        });

        document.addEventListener('touchend', (e) => {
            if (!e.target.classList.contains('scale-btn')) {
                const touchDuration = Date.now() - touchStartTime;
                if (touchDuration < 300) { // Quick tap
                    e.preventDefault();
                    advanceToNext();
                }
            }
        });

        // Click controls for desktop
        document.addEventListener('click', (e) => {
            if (!e.target.classList.contains('scale-btn')) {
                advanceToNext();
            }
        });

        function advanceToNext() {
            const scaleKeys = ['self', 'moon', 'sun', 'galaxy', 'horizon', 'return'];
            const currentIndex = scaleKeys.indexOf(currentScale);
            const nextIndex = (currentIndex + 1) % scaleKeys.length;
            updateScale(scaleKeys[nextIndex]);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            updateScale(currentScale);
        });

        // Prevent default touch behaviors
        document.addEventListener('touchmove', (e) => {
            e.preventDefault();
        }, { passive: false });

        document.addEventListener('gesturestart', (e) => {
            e.preventDefault();
        });

        document.addEventListener('gesturechange', (e) => {
            e.preventDefault();
        });

        document.addEventListener('gestureend', (e) => {
            e.preventDefault();
        });

        // Robust initialization for deployment environments
        function initializeThreadedLadder() {
            updateScale('self');
            window.threadedLadderInitialized = true;
        }
        
        // Multiple initialization triggers for deployment compatibility
        if (document.readyState === 'complete') {
            initializeThreadedLadder();
        } else if (document.readyState === 'interactive') {
            setTimeout(initializeThreadedLadder, 100);
        } else {
            document.addEventListener('DOMContentLoaded', () => {
                setTimeout(initializeThreadedLadder, 100);
            });
        }
        
        // Fallback for deployment environments
        window.addEventListener('load', () => {
            if (!window.threadedLadderInitialized) {
                setTimeout(initializeThreadedLadder, 200);
            }
        });
    </script>
</body>
</html>
